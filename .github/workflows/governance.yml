name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "checked out $actual, expected $EXPECTED_HEAD" >&2
            exit 1
          }

      - name: Require governance files and public boundary
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            AGENTS.md SECURITY.md CONTRIBUTING.md \
            docs/product/PRD.md docs/product/ROADMAP.md docs/product/ROADMAP_GRAPH.tsv \
            docs/engineering/AGENT_GRAPH.md .opencode/graph.yaml; do
            test -f "$path" || { echo "missing $path" >&2; exit 1; }
          done
          test ! -d services || {
            echo 'Hosted service implementation is forbidden in the public repository.' >&2
            exit 1
          }

      - name: Reject shipped Python sources without fail-open paths
        shell: bash
        run: |
          set -euo pipefail
          for dir in apps crates integrations packages simulators; do
            if [[ -d "$dir" ]] && find "$dir" -type f -name '*.py' -print -quit | grep -q .; then
              echo "Python source is not permitted in shipped product path: $dir" >&2
              exit 1
            fi
          done

      - name: Validate dependency graph
        shell: bash
        run: |
          set -euo pipefail
          awk -F '\t' '
            NR == 1 {
              if ($1 != "issue" || $2 != "milestone" || $3 != "dependencies") exit 10
              next
            }
            {
              issue = $1 + 0
              if (issue != NR - 1 || seen[issue]++) exit 11
              if ($3 != "-") {
                count = split($3, deps, ",")
                for (i = 1; i <= count; i++) {
                  dep = deps[i] + 0
                  if (dep < 1 || dep >= issue) exit 12
                }
              }
            }
            END { if (NR != 62) exit 13 }
          ' docs/product/ROADMAP_GRAPH.tsv

      - name: Require independent agent provenance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          field() {
            printf '%s\n' "$PR_BODY" | sed -n "s/^$1:[[:space:]]*//p" | head -n1
          }
          implementer="$(field AGENT_IMPLEMENTER)"
          verifier="$(field AGENT_VERIFIER)"
          reviewer="$(field AGENT_REVIEWER)"
          security="$(field AGENT_SECURITY)"
          evaluator="$(field AGENT_EVALUATOR)"
          verifier_verdict="$(field GATE_VERIFIER_VERDICT)"
          reviewer_verdict="$(field GATE_REVIEWER_VERDICT)"
          security_verdict="$(field GATE_SECURITY_VERDICT)"
          evaluator_verdict="$(field GATE_EVALUATOR_VERDICT)"
          # AGENT_IMPLEMENTER is the implementer's self-declaration; it
          # must be non-empty, non-pending, and distinct from the four
          # gate values. The implementer is not required to use the
          # clean-context identifier format because they are the author.
          [[ -n "$implementer" && "$implementer" != pending ]] || {
            echo 'Missing non-pending AGENT_IMPLEMENTER provenance in PR body.' >&2
            exit 1
          }
          gate_re='^OSTR-CONTEXT-(VERIFIER|REVIEWER|SECURITY|EVALUATOR)-[A-Za-z0-9_-]+$'
          for value in "$verifier" "$reviewer" "$security" "$evaluator"; do
            [[ "$value" =~ $gate_re ]] || {
              echo "AGENT_* value '$value' does not identify a clean review context." >&2
              exit 1
            }
          done
          # Cross-check the role encoded in each value matches the field
          # it appears in. This closes "operator-issued string but wrong
          # role" mistakes.
          [[ "$verifier"  =~ ^OSTR-CONTEXT-VERIFIER-  ]]  || { echo "AGENT_VERIFIER role mismatch: $verifier"  >&2; exit 1; }
          [[ "$reviewer"  =~ ^OSTR-CONTEXT-REVIEWER-  ]]  || { echo "AGENT_REVIEWER role mismatch: $reviewer"  >&2; exit 1; }
          [[ "$security"   =~ ^OSTR-CONTEXT-SECURITY-  ]]  || { echo "AGENT_SECURITY role mismatch: $security"   >&2; exit 1; }
          [[ "$evaluator"  =~ ^OSTR-CONTEXT-EVALUATOR- ]]  || { echo "AGENT_EVALUATOR role mismatch: $evaluator" >&2; exit 1; }
          # All five must remain pairwise distinct (implementer + 4 gates).
          # The four review contexts must be pairwise distinct.
          [[ "$verifier" != "$reviewer" \
            && "$verifier" != "$security" \
            && "$verifier" != "$evaluator" \
            && "$reviewer" != "$security" \
            && "$reviewer" != "$evaluator" \
            && "$security" != "$evaluator" ]] || {
            echo 'AGENT_VERIFIER / AGENT_REVIEWER / AGENT_SECURITY / AGENT_EVALUATOR must be pairwise distinct.' >&2
            exit 1
          }
          # And the implementer must differ from each gate.
          [[ "$implementer" != "$verifier" \
            && "$implementer" != "$reviewer" \
            && "$implementer" != "$security" \
            && "$implementer" != "$evaluator" ]] || {
            echo 'AGENT_IMPLEMENTER must differ from each gate value.' >&2
            exit 1
          }
          expected="APPROVE@${{ github.event.pull_request.head.sha }}"
          for value in "$verifier_verdict" "$reviewer_verdict" "$security_verdict" "$evaluator_verdict"; do
            [[ "$value" = "$expected" ]] || {
              echo "Required exact-head verdict is '$expected', got '$value'." >&2
              exit 1
            }
          done

      - name: Enforce DCO on every pull-request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-list "$BASE_SHA..HEAD" | while read -r commit; do
            git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$' || {
              echo "Commit $commit lacks a DCO Signed-off-by trailer." >&2
              exit 1
            }
          done
