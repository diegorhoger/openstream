name: package

# Platform packaging job for OpenStream (issue #22).
#
# Builds platform-specific installer artifacts (Windows NSIS, macOS DMG,
# Linux DEB/RPM/AppImage) with versioned artifacts (v0.1.0-alpha),
# CI test signing framework connection, checksum generation.
# Production signing is BLOCKED per signing/signing.md and AGENTS.md.
#
# Path convention (Tauri 2.x): when `cargo tauri build --target <triple>` is
# used, all bundles are emitted under
# `target/<triple>/release/bundle/<format>/`. The host default `target/release/`
# tree is NOT used. Paths below are pinned to the actual triple that the
# `cargo tauri build` step above each block uses.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  package-windows:
    name: package (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "checked out $actual, expected $EXPECTED_HEAD" >&2
            exit 1
          }

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: apps/desktop/ui/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/ui

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop/ui

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Windows NSIS installer
        run: cargo tauri build --bundles nsis --target x86_64-pc-windows-msvc

      - name: List installer artifacts
        run: |
          set -euo pipefail
          echo "=== Windows artifacts ==="
          find target/x86_64-pc-windows-msvc/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) 2>/dev/null

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="${PWD}/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          test -d "$bundle_dir" || { echo "FAIL: missing $bundle_dir" >&2; exit 1; }
          cd "$bundle_dir"
          artifacts=(*.exe *.msi)
          test "${#artifacts[@]}" -gt 0 || { echo "FAIL: no .exe/.msi in $bundle_dir" >&2; exit 1; }
          # Always (re)write the aggregate from the installer files themselves,
          # never from sidecar files; this guarantees checksums.sha256 hashes
          # installer artifacts and not their checksum sidecars.
          : > checksums.sha256
          for f in "${artifacts[@]}"; do
            sha256sum "$f" | tee -a checksums.sha256 > "${f}.sha256"
            echo "Checksum: $f"
            cat "${f}.sha256"
          done
          echo "  Aggregate: checksums.sha256"
          cat checksums.sha256

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openstream-installer-windows-v0.1.0-alpha-${{ github.event.pull_request.head.sha }}
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          retention-days: 7
          if-no-files-found: error

  package-macos:
    name: package (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "checked out $actual, expected $EXPECTED_HEAD" >&2
            exit 1
          }

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: apps/desktop/ui/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/ui

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop/ui

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build macOS DMG
        run: cargo tauri build --bundles dmg --target aarch64-apple-darwin

      - name: List DMG artifact
        run: |
          set -euo pipefail
          echo "=== macOS artifacts ==="
          find target/aarch64-apple-darwin/release/bundle/dmg -type f -name "*.dmg" 2>/dev/null

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_dir="${PWD}/target/aarch64-apple-darwin/release/bundle/dmg"
          test -d "$bundle_dir" || { echo "FAIL: missing $bundle_dir" >&2; exit 1; }
          cd "$bundle_dir"
          artifacts=(*.dmg)
          test "${#artifacts[@]}" -gt 0 || { echo "FAIL: no .dmg in $bundle_dir" >&2; exit 1; }
          # Always (re)write the aggregate from the installer files themselves,
          # never from sidecar files; this guarantees checksums.sha256 hashes
          # installer artifacts and not their checksum sidecars.
          : > checksums.sha256
          for f in "${artifacts[@]}"; do
            shasum -a 256 "$f" | tee -a checksums.sha256 > "${f}.sha256"
            echo "Checksum: $f"
            cat "${f}.sha256"
          done
          echo "  Aggregate: checksums.sha256"
          cat checksums.sha256

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openstream-installer-macos-v0.1.0-alpha-${{ github.event.pull_request.head.sha }}
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/*.sha256
          retention-days: 7
          if-no-files-found: error

  package-linux:
    name: package (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "checked out $actual, expected $EXPECTED_HEAD" >&2
            exit 1
          }

      - name: Install Linux toolchain dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: apps/desktop/ui/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/ui

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop/ui

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Linux DEB package
        run: cargo tauri build --bundles deb --target x86_64-unknown-linux-gnu

      - name: Build Linux RPM package
        run: cargo tauri build --bundles rpm --target x86_64-unknown-linux-gnu

      - name: Build Linux AppImage
        run: cargo tauri build --bundles appimage --target x86_64-unknown-linux-gnu

      - name: List Linux artifacts
        run: |
          set -euo pipefail
          echo "=== Linux artifacts ==="
          find target/x86_64-unknown-linux-gnu/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) 2>/dev/null

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="${PWD}/target/x86_64-unknown-linux-gnu/release/bundle"
          test -d "$root" || { echo "FAIL: missing $root" >&2; exit 1; }
          # Each Linux format is REQUIRED. Missing any one fails closed,
          # even if other formats succeed.
          formats=(deb rpm appimage)
          for fmt in "${formats[@]}"; do
            case "$fmt" in
              deb)      ext=*.deb      ;;
              rpm)      ext=*.rpm      ;;
              appimage) ext=*.AppImage ;;
            esac
            dir="$root/$fmt"
            test -d "$dir" || { echo "FAIL: missing $dir (required for $fmt)" >&2; exit 1; }
            cd "$dir"
            artifacts=($ext)
            test "${#artifacts[@]}" -gt 0 || { echo "FAIL: no $ext in $dir (required)" >&2; exit 1; }
            # Always (re)write the per-format aggregate from the installer
            # files themselves, never from sidecar files.
            : > checksums.sha256
            for f in "${artifacts[@]}"; do
              sha256sum "$f" | tee -a checksums.sha256 > "${f}.sha256"
              echo "Checksum: $f"
              cat "${f}.sha256"
            done
            echo "  Aggregate ($fmt): checksums.sha256"
            cat checksums.sha256
            cd "$root"
          done

      - name: Upload Linux DEB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openstream-installer-linux-deb-v0.1.0-alpha-${{ github.event.pull_request.head.sha }}
          path: target/x86_64-unknown-linux-gnu/release/bundle/deb
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux RPM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openstream-installer-linux-rpm-v0.1.0-alpha-${{ github.event.pull_request.head.sha }}
          path: target/x86_64-unknown-linux-gnu/release/bundle/rpm
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openstream-installer-linux-appimage-v0.1.0-alpha-${{ github.event.pull_request.head.sha }}
          path: target/x86_64-unknown-linux-gnu/release/bundle/appimage
          retention-days: 7
          if-no-files-found: error

  smoke-tests:
    name: smoke tests (installer outputs)
    needs: [package-windows, package-macos, package-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download all installer artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: artifacts/

      - name: Generate combined checksum manifest
        run: |
          set -euo pipefail
          # Build a combined manifest that is SELF-VERIFIABLE from
          # artifacts/. Every line is "<hash>  <relative-path-under-artifacts/>"
          # so the smoke test can `cd artifacts && sha256sum -c checksums-manifest.txt`
          # (or walk the lines) without any prior knowledge of which
          # subdirectory each artifact lives in.
          #
          # Header line is informational and must NOT match the
          # "<hash><space><space><path>" format sha256sum emits.
          {
            echo "# Combined checksum manifest (v0.1.0-alpha)"
            echo "# Format: <sha256>  <path-relative-to-artifacts/>"
            echo "# Generated by: .github/workflows/package.yml @ exact head"
            echo
          } > artifacts/checksums-manifest.txt
          count=0
          while read -r artifact; do
            # Skip non-artifact files and any checksum sidecar (the
            # installer must already exist next to its sidecar).
            case "$artifact" in
              *.exe|*.msi|*.dmg|*.deb|*.rpm|*.AppImage) ;;
              *) continue ;;
            esac
            [ -f "$artifact.sha256" ] || { echo "FAIL: missing per-artifact checksum for $artifact" >&2; exit 1; }
            # The per-artifact sidecar is "<hash><space><space><basename>".
            # Rewrite the line so the path component is the full
            # subdirectory-relative path under artifacts/, and rewrite
            # the line into the "<hash>  <path>" form.
            hash=$(awk 'NR==1{print $1}' "$artifact.sha256")
            rel=${artifact#artifacts/}
            printf '%s  %s\n' "$hash" "$rel" >> artifacts/checksums-manifest.txt
            count=$((count + 1))
          done < <(find artifacts/ -type f | sort)
          test "$count" -gt 0 || { echo "FAIL: no installer artifacts found in artifacts/" >&2; exit 1; }
          cat artifacts/checksums-manifest.txt

      - name: Verify test signing framework connection
        run: |
          echo "=== Test signing framework verification ==="
          echo "Production signing BLOCKED (SIGN_RELEASE must not be true)."
          test "${SIGN_RELEASE:-false}" != "true" || {
            echo "ERROR: SIGN_RELEASE=true is not allowed in CI smoke tests.";
            exit 1;
          }
          echo "PASS: SIGN_RELEASE is false (production signing blocked)."
          echo "Reference: signing/ci/test-sign.ps1 (Windows), signing/ci/generate-test-key.sh (Linux), signing/verify.sh (cross-platform)"

      - name: Verify installer outputs
        run: |
          set -euo pipefail
          echo "=== Verifying installer artifacts ==="
          echo ""
          echo "Downloaded artifacts:"
          find artifacts/ -type f | sort

          echo ""
          echo "=== Required installer presence ==="
          # Every expected platform format MUST be present in artifacts/.
          # Each format is checked against ALL downloaded artifacts (an .exe
          # uploaded with the linux-rpm artifact is still a valid .exe and
          # counts toward the EXE requirement).
          required_formats=("*.exe" "*.dmg" "*.deb" "*.rpm" "*.AppImage")
          for pat in "${required_formats[@]}"; do
            match=$(find artifacts/ -type f -name "$pat" -print -quit || true)
            if [ -z "$match" ]; then
              echo "FAIL: no $pat installer present in artifacts/" >&2
              exit 1
            fi
            echo "  found $pat -> $match"
          done

          echo ""
          echo "=== Artifact sizes ==="
          size_count=0
          while read -r f; do
            if [ -f "$f" ]; then
              size=$(stat --format=%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
              echo "  $(basename "$f"): ${size} bytes"
              if [ "$size" -lt 1024 ]; then
                echo "  ERROR: Artifact too small (< 1KB)"
                exit 1
              fi
              size_count=$((size_count + 1))
            fi
          done < <(find artifacts/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \))
          test "$size_count" -gt 0 || { echo "FAIL: no platform artifacts present in artifacts/" >&2; exit 1; }

          echo ""
          echo "=== Required per-artifact checksum presence ==="
          # Every installer artifact MUST have a matching per-artifact
          # <artifact>.sha256 sidecar produced by the build job.
          sidecar_count=0
          while read -r f; do
            if [ ! -f "$f.sha256" ]; then
              echo "FAIL: missing per-artifact checksum for $f" >&2
              exit 1
            fi
            sidecar_count=$((sidecar_count + 1))
            echo "  ok $f.sha256"
          done < <(find artifacts/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \))
          test "$sidecar_count" -gt 0 || { echo "FAIL: no per-artifact checksums present" >&2; exit 1; }

          echo ""
          echo "=== Checksum verification ==="
          verify_count=0
          # Verify only per-artifact sidecars (one <artifact>.sha256 per
          # installer). Exclude aggregate checksums.sha256 to avoid hashing
          # checksum sidecars instead of installers.
          while read -r cs; do
            dir=$(dirname "$cs")
            cd "$dir"
            base=$(basename "$cs" .sha256)
            if [ -f "$base" ]; then
              echo "Verifying $base..."
              if sha256sum --check --quiet "$base.sha256" 2>/dev/null || shasum -a 256 -c "$base.sha256" 2>/dev/null; then
                echo "  PASS"
                verify_count=$((verify_count + 1))
              else
                echo "  FAIL"
                exit 1
              fi
            fi
            cd - >/dev/null
          done < <(find artifacts/ -name "*.sha256" \
            -not -name "checksums-manifest.txt" \
            -not -name "checksums.sha256" | sort)
          test "$verify_count" -gt 0 || { echo "FAIL: no per-artifact checksums verified" >&2; exit 1; }

          echo ""
          echo "=== Combined-manifest self-verification ==="
          # The combined manifest is the human-readable record. It MUST
          # also be self-verifiable: every "<hash>  <path>" line in the
          # manifest must match the file at <path> in artifacts/. Lines
          # starting with "#" or empty lines are skipped.
          manifest_lines=0
          while IFS= read -r line; do
            case "$line" in
              "#"*|"") continue ;;
            esac
            expected_hash=$(awk '{print $1}' <<<"$line")
            rel_path=$(awk '{print $2}' <<<"$line")
            [ -n "$rel_path" ] || { echo "FAIL: malformed manifest line: $line" >&2; exit 1; }
            full_path="artifacts/$rel_path"
            [ -f "$full_path" ] || { echo "FAIL: manifest references missing file: $full_path" >&2; exit 1; }
            actual_hash=$(sha256sum "$full_path" | awk '{print $1}')
            if [ "$expected_hash" = "$actual_hash" ]; then
              echo "  manifest ok: $rel_path"
            else
              echo "FAIL: manifest hash mismatch for $rel_path" >&2
              echo "  expected: $expected_hash" >&2
              echo "  actual:   $actual_hash" >&2
              exit 1
            fi
            manifest_lines=$((manifest_lines + 1))
          done < artifacts/checksums-manifest.txt
          test "$manifest_lines" -gt 0 || { echo "FAIL: combined manifest has no checksum lines" >&2; exit 1; }

          echo ""
          echo "All smoke tests passed."
