[package]
name = "openstream-domain"
description = "Pure OpenStream domain types, IDs, and validation. Imports no UI, database, network, Tauri, or Cloud implementation (ADR-0001, TECHNICAL_SPEC §3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.25.0", features = ["v7", "serde"] }

[dev-dependencies]
proptest = "=1.11.0"
