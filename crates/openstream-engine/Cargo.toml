[package]
name = "openstream-engine"
description = "Deterministic action graph execution with durable prepared/result evidence. The Engine is the sole privileged authority (TECHNICAL_SPEC §1, §5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
openstream-domain = { path = "../openstream-domain" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["v7"] }

[dev-dependencies]
proptest = "=1.11.0"
