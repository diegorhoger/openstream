[package]
name = "openstream-desktop"
description = "OpenStream desktop composition root (Tauri 2). Deny-by-default shell; all authority remains in Rust crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
openstream-domain = { path = "../../../crates/openstream-domain" }
openstream-engine = { path = "../../../crates/openstream-engine" }
openstream-persistence = { path = "../../../crates/openstream-persistence" }
# Studio command DTOs (issue #17): serde derive for the closed op vocabulary.
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows autostart registration backend (`HKCU\...\Run`, issue #16).
# Already a transitive lockfile member via Tauri; pinned exactly per repo
# policy. Safe wrapper only: this crate keeps `unsafe_code = "forbid"`.
winreg = "=0.55.0"
# Windows global-shortcut REGISTRATION backend (issue #19): RegisterHotKey-
# class OS registration only â€” the crate never installs keyboard hooks.
# Pinned exactly per repo policy.
global-hotkey = "=0.8.0"
# Windows focused-app identity source (issue #19): foreground-window process
# image name only. Pinned exactly per repo policy.
active-win-pos-rs = "=0.8.3"

[dev-dependencies]
tempfile = "=3.27.0"
serde_json = "=1.0.151"

[lints]
workspace = true
